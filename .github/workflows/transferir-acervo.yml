name: Transferir acervo Hellena-Law
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transferir-acervo.yml'
permissions:
  contents: write
concurrency:
  group: transferencia-acervo
  cancel-in-progress: true
jobs:
  transferir:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Obter destino
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Obter snapshot público sem executar código da origem
        run: git clone --depth 1 https://github.com/xmercadoamericalatina/leis.git "$RUNNER_TEMP/acervo-origem"
      - name: Transferir dados e comparar modo e SHA dos arquivos
        run: python3 -I scripts/transferir_acervo.py "$RUNNER_TEMP/acervo-origem"
      - name: Testar atualizador transferido
        run: python3 -I -m unittest discover -s scripts/lei_seca -p 'test_*.py' -v
      - name: Auditar coleção transferida
        run: python3 -I scripts/lei_seca/auditar.py lei-seca
