name: Transferir acervo Hellena-Law
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/transferir-acervo.yml']
permissions:
  contents: write
concurrency:
  group: transferencia-acervo
  cancel-in-progress: false
jobs:
  transferir:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Obter snapshot público
        run: git clone --depth 1 https://github.com/xmercadoamericalatina/leis.git "$RUNNER_TEMP/acervo-origem"
      - name: Transferir arquivos em lotes com histórico independente
        shell: python
        run: |
          import os, pathlib, shutil, subprocess
          src = pathlib.Path(os.environ['RUNNER_TEMP']) / 'acervo-origem'
          dest = pathlib.Path.cwd()
          def git(*args, cwd=dest):
              return subprocess.check_output(['git', *args], cwd=cwd)
          git('config', 'user.name', 'XMERCADO HELLENAI')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          sha = git('rev-parse', 'HEAD', cwd=src).decode().strip()
          paths = git('ls-files', '-z', cwd=src).decode().split('\0')
          batch, size, number = [], 0, 0
          def save():
              global batch, size, number
              if not batch:
                  return
              for i in range(0, len(batch), 150):
                  git('add', '--', *batch[i:i+150])
              if subprocess.run(['git','diff','--cached','--quiet']).returncode:
                  number += 1
                  git('commit', '-m', 'Transfere acervo para Hellena-Law — lote ' + str(number))
                  git('push', 'origin', 'HEAD:main')
              batch, size = [], 0
          for name in paths:
              if not name or name in ('README.md','USO_E_CREDITOS.md'):
                  continue
              if name.startswith('.github/'):
                  if name != '.github/workflows/lei-seca.yml':
                      continue
              source = src / name
              if source.is_symlink():
                  raise RuntimeError('Link simbólico requer revisão: ' + name)
              if not source.is_file():
                  continue
              target_name = 'LICENSE-TERCEIROS' if name == 'LICENSE' else name
              target = dest / target_name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              batch.append(target_name)
              size += source.stat().st_size
              if size >= 100 * 1024 * 1024 or len(batch) >= 2000:
                  save()
          save()
          proof = dest / 'TRANSFERENCIA.md'
          proof.write_text('# Transferência do acervo\n\nSnapshot transferido: ' + sha + '\n\nHistórico de destino independente. Licenças preexistentes preservadas em LICENSE-TERCEIROS. Materiais próprios conforme USO_E_CREDITOS.md.\n', encoding='utf-8')
          batch.append('TRANSFERENCIA.md')
          save()
